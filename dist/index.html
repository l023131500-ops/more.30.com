<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>אופטיקה לכל כיס — ניהול מכירות</title>
<meta name="description" content="מערכת ניהול מכירות משקפיים בשכונות — לוח שנה עברי־לועזי, ניהול מכירה, לקוחות, רווחיות, דוחות וצינתוקים.">
<meta name="theme-color" content="#1e4e8c">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👓</text></svg>">
<style>
/* ============================================================
   אופטיקה לכל כיס — מערכת ניהול מכירות | עיצוב RTL
   ============================================================ */

:root {
  --bg: #f4f6fb;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --border: #e2e8f0;
  --border-strong: #cbd5e1;
  --text: #0f172a;
  --text-muted: #64748b;
  --text-faint: #94a3b8;

  --brand: #1e4e8c;
  --brand-dark: #163a68;
  --brand-light: #e8f0fb;

  --green: #16a34a;
  --green-bg: #d6f5e0;
  --green-border: #86efac;
  --blue: #2563eb;
  --blue-bg: #d6e6ff;
  --blue-border: #93c5fd;
  --red: #dc2626;
  --red-bg: #fee2e2;
  --red-border: #fca5a5;
  --gray: #64748b;
  --gray-bg: #dfe5ee;
  --gray-border: #cbd5e1;
  --amber: #d97706;
  --amber-bg: #fef3c7;
  --purple: #7c3aed;

  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 1px 3px rgba(15, 23, 42, .07), 0 1px 2px rgba(15, 23, 42, .04);
  --shadow-lg: 0 10px 30px rgba(15, 23, 42, .12);
  --font: "Segoe UI", "Assistant", "Rubik", Arial, "Noto Sans Hebrew", sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  direction: rtl;
}

button, input, select, textarea { font-family: inherit; font-size: inherit; }

/* ------------------------------ פריסה ------------------------------ */

.app { display: flex; min-height: 100vh; }

.sidebar {
  width: 232px; flex-shrink: 0;
  background: var(--brand);
  color: #fff;
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh;
  overflow-y: auto;
}
.sidebar .brand { padding: 20px 18px 16px; border-bottom: 1px solid rgba(255,255,255,.15); }
.sidebar .brand h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -.2px; }
.sidebar .brand p { margin: 4px 0 0; font-size: 12px; opacity: .75; }
.nav { padding: 10px 8px; flex: 1; }
.nav a {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; margin-bottom: 3px;
  border-radius: var(--radius-sm);
  color: rgba(255,255,255,.85); text-decoration: none;
  font-size: 14.5px; cursor: pointer;
  transition: background .12s;
}
.nav a:hover { background: rgba(255,255,255,.1); color: #fff; }
.nav a.active { background: #fff; color: var(--brand); font-weight: 600; }
.nav a .ico { font-size: 17px; width: 22px; text-align: center; }
.sidebar-foot { padding: 12px 14px; font-size: 11.5px; opacity: .6; border-top: 1px solid rgba(255,255,255,.12); }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 22px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  position: sticky; top: 0; z-index: 30;
}
.topbar h2 { margin: 0; font-size: 20px; font-weight: 700; }
.topbar .spacer { flex: 1; }

.content { padding: 20px 22px 60px; }

/* ------------------------------ רכיבים ------------------------------ */

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-bottom: 16px;
  overflow: hidden;
}
.card > h3 {
  margin: 0; padding: 13px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 15.5px; font-weight: 700;
  background: var(--surface-2);
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.card > h3 .spacer { flex: 1; }
.card-body { padding: 16px; }
.card-body.tight { padding: 0; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px 14px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text);
  border-radius: var(--radius-sm);
  cursor: pointer; font-size: 14px; font-weight: 500;
  transition: all .12s; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); border-color: var(--text-faint); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { background: var(--brand-dark); }
.btn.success { background: var(--green); border-color: var(--green); color: #fff; }
.btn.success:hover { filter: brightness(.93); }
.btn.danger { background: var(--red); border-color: var(--red); color: #fff; }
.btn.danger:hover { filter: brightness(.93); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { padding: 5px 9px; font-size: 12.5px; }
.btn.lg { padding: 11px 20px; font-size: 15.5px; }

.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12.5px; color: var(--text-muted); margin-bottom: 5px; font-weight: 600; }
.input, select.input, textarea.input {
  width: 100%; padding: 8px 11px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: #fff; color: var(--text);
  outline: none; transition: border-color .12s, box-shadow .12s;
}
.input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-light); }
textarea.input { min-height: 72px; resize: vertical; }

.grid { display: grid; gap: 12px; }
.grid.c2 { grid-template-columns: repeat(2, 1fr); }
.grid.c3 { grid-template-columns: repeat(3, 1fr); }
.grid.c4 { grid-template-columns: repeat(4, 1fr); }
.grid.c5 { grid-template-columns: repeat(5, 1fr); }
.grid.c6 { grid-template-columns: repeat(6, 1fr); }
@media (max-width: 1100px) { .grid.c5, .grid.c6 { grid-template-columns: repeat(3, 1fr); } .grid.c4 { grid-template-columns: repeat(2,1fr);} }
@media (max-width: 760px) { .grid.c2, .grid.c3, .grid.c4, .grid.c5, .grid.c6 { grid-template-columns: 1fr; } }

.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }

.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 9px; border-radius: 999px;
  font-size: 12px; font-weight: 600;
  background: var(--gray-bg); color: var(--gray);
  border: 1px solid var(--gray-border);
}
.badge.green { background: var(--green-bg); color: #15803d; border-color: var(--green-border); }
.badge.blue { background: var(--blue-bg); color: #1d4ed8; border-color: var(--blue-border); }
.badge.red { background: var(--red-bg); color: #b91c1c; border-color: var(--red-border); }
.badge.amber { background: var(--amber-bg); color: #b45309; border-color: #fcd34d; }
.badge.purple { background: #ede9fe; color: #6d28d9; border-color: #c4b5fd; }

/* ------------------------------ KPI ------------------------------ */

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 13px 15px; box-shadow: var(--shadow);
  border-top: 3px solid var(--brand);
}
.kpi .label { font-size: 12px; color: var(--text-muted); font-weight: 600; margin-bottom: 5px; }
.kpi .value { font-size: 22px; font-weight: 700; letter-spacing: -.5px; }
.kpi .sub { font-size: 11.5px; color: var(--text-faint); margin-top: 3px; }
.kpi.green { border-top-color: var(--green); } .kpi.green .value { color: #15803d; }
.kpi.red { border-top-color: var(--red); } .kpi.red .value { color: #b91c1c; }
.kpi.amber { border-top-color: var(--amber); } .kpi.amber .value { color: #b45309; }
.kpi.blue { border-top-color: var(--blue); } .kpi.blue .value { color: #1d4ed8; }
.kpi.purple { border-top-color: var(--purple); } .kpi.purple .value { color: #6d28d9; }

/* ------------------------------ לוח שנה ------------------------------ */

.cal-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.cal-title { font-size: 22px; font-weight: 700; }
.cal-title small { display: block; font-size: 13px; color: var(--text-muted); font-weight: 500; }

.calendar { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.cal-dow { display: grid; grid-template-columns: repeat(7, 1fr); background: var(--brand); color: #fff; }
.cal-dow div { padding: 9px 4px; text-align: center; font-size: 13px; font-weight: 600; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }

.cal-day {
  min-height: 116px; border-left: 1px solid var(--border); border-bottom: 1px solid var(--border);
  padding: 6px 7px; position: relative; cursor: pointer;
  display: flex; flex-direction: column; gap: 4px;
  transition: box-shadow .12s, filter .12s;
  background: var(--surface);
}
.cal-day:nth-child(7n) { border-left: none; }
.cal-day:hover { box-shadow: inset 0 0 0 2px var(--brand); z-index: 2; }
.cal-day.other { opacity: .38; }
.cal-day.today { box-shadow: inset 0 0 0 2px var(--amber); }
.cal-day .dnum { display: flex; align-items: baseline; gap: 6px; }
.cal-day .g { font-size: 17px; font-weight: 700; line-height: 1; }
.cal-day .h { font-size: 11.5px; color: var(--text-muted); font-weight: 600; }
.cal-day .hol { font-size: 10.5px; color: var(--gray); font-weight: 600; line-height: 1.25; }

.cal-day.st-available { background: var(--green-bg); }
.cal-day.st-available .g { color: #15803d; }
.cal-day.st-sale { background: var(--blue-bg); }
.cal-day.st-sale .g { color: #1d4ed8; }
.cal-day.st-blocked { background: var(--red-bg); }
.cal-day.st-blocked .g { color: #b91c1c; }
.cal-day.st-off { background: var(--gray-bg); color: var(--gray); }
.cal-day.st-off .g { color: var(--gray); }

.sale-chip {
  background: #fff; border: 1px solid var(--blue-border); border-right: 3px solid var(--blue);
  border-radius: 6px; padding: 3px 6px; font-size: 11.5px; line-height: 1.3;
  overflow: hidden;
}
.sale-chip b { display: block; font-size: 12px; color: #1d4ed8; }
.sale-chip span { color: var(--text-muted); }
.sale-chip.s2 { border-right-color: var(--purple); border-color: #c4b5fd; }
.sale-chip.s2 b { color: #6d28d9; }

.cal-add {
  position: absolute; bottom: 4px; left: 4px;
  width: 22px; height: 22px; border-radius: 6px;
  border: 1px dashed var(--border-strong); background: rgba(255,255,255,.85);
  color: var(--text-muted); font-size: 15px; line-height: 1;
  display: none; align-items: center; justify-content: center; cursor: pointer; padding: 0;
}
.cal-day:hover .cal-add { display: flex; }
.cal-add:hover { background: var(--brand); color: #fff; border-color: var(--brand); border-style: solid; }

.legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 12px; font-size: 12.5px; color: var(--text-muted); }
.legend i { display: inline-block; width: 13px; height: 13px; border-radius: 4px; margin-left: 5px; vertical-align: -2px; border: 1px solid rgba(0,0,0,.08); }

@media (max-width: 900px) { .cal-day { min-height: 88px; } .cal-day .h { display: none; } }

/* ------------------------------ טבלאות ------------------------------ */

.table-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.tbl th, table.tbl td { border: 1px solid var(--border); padding: 6px 8px; text-align: right; vertical-align: middle; }
table.tbl thead th {
  background: var(--brand); color: #fff; font-weight: 600; font-size: 13px;
  position: sticky; top: 0; z-index: 5; white-space: nowrap;
}
table.tbl tbody tr:nth-child(even) { background: var(--surface-2); }
table.tbl tbody tr:hover { background: var(--brand-light); }
table.tbl td.side-head { background: var(--brand-light); font-weight: 700; text-align: center; color: var(--brand); white-space: nowrap; }
table.tbl tfoot td { background: #eef2f7; font-weight: 700; }
table.tbl input, table.tbl select {
  width: 100%; border: 1px solid transparent; background: transparent;
  padding: 4px 5px; border-radius: 5px; outline: none; min-width: 60px;
}
table.tbl input:focus, table.tbl select:focus { border-color: var(--brand); background: #fff; box-shadow: 0 0 0 2px var(--brand-light); }
table.tbl input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--green); cursor: pointer; }
table.tbl td.center { text-align: center; }
table.tbl .rownum { background: var(--surface-2); color: var(--text-faint); font-size: 12px; text-align: center; width: 42px; }
.tbl-title { padding: 9px 14px; background: var(--brand-light); border-bottom: 1px solid var(--border); font-weight: 700; color: var(--brand); }

/* ------------------------------ מודאל ------------------------------ */

.modal-back {
  position: fixed; inset: 0; background: rgba(15,23,42,.5);
  display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px;
  backdrop-filter: blur(2px);
}
.modal {
  background: var(--surface); border-radius: var(--radius);
  box-shadow: var(--shadow-lg); width: min(760px, 100%);
  max-height: 90vh; display: flex; flex-direction: column; overflow: hidden;
}
.modal.wide { width: min(1100px, 100%); }
.modal.narrow { width: min(440px, 100%); }
.modal-head { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; background: var(--surface-2); }
.modal-head h3 { margin: 0; font-size: 17px; }
.modal-body { padding: 18px; overflow: auto; flex: 1; }
.modal-foot { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-start; background: var(--surface-2); }

/* ------------------------------ טוסט ------------------------------ */

.toasts { position: fixed; bottom: 20px; left: 20px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
.toast {
  background: #0f172a; color: #fff; padding: 11px 16px; border-radius: var(--radius-sm);
  box-shadow: var(--shadow-lg); font-size: 14px; max-width: 380px;
  animation: slideIn .18s ease-out;
}
.toast.err { background: var(--red); }
.toast.ok { background: var(--green); }
@keyframes slideIn { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ------------------------------ שונות ------------------------------ */

.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--border); margin-bottom: 16px; flex-wrap: wrap; }
.tabs button {
  background: none; border: none; padding: 9px 15px; cursor: pointer;
  font-size: 14.5px; color: var(--text-muted); font-weight: 600;
  border-bottom: 2px solid transparent; margin-bottom: -2px;
}
.tabs button.active { color: var(--brand); border-bottom-color: var(--brand); }
.tabs button:hover { color: var(--text); }

.empty { text-align: center; padding: 40px 20px; color: var(--text-faint); }
.empty .ico { font-size: 40px; opacity: .5; margin-bottom: 8px; }

.chart { display: flex; align-items: flex-end; justify-content: center; gap: 10px; height: 180px; padding: 10px 0; }
.chart .bar { flex: 1; max-width: 110px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; min-width: 0; }
.chart .bar .fill { width: 100%; background: var(--brand); border-radius: 4px 4px 0 0; min-height: 2px; transition: height .3s; }
.chart .bar .fill.green { background: var(--green); }
.chart .bar .fill.red { background: var(--red); }
.chart .bar .lbl { font-size: 10.5px; color: var(--text-muted); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.chart .bar .val { font-size: 11px; font-weight: 700; }

.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 14px; }
.filters .field { margin: 0; min-width: 140px; }

.checkline { display: flex; align-items: center; gap: 8px; padding: 5px 0; }
.checkline input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--brand); }

.file-drop {
  border: 2px dashed var(--border-strong); border-radius: var(--radius);
  padding: 26px; text-align: center; color: var(--text-muted); cursor: pointer;
  background: var(--surface-2); transition: all .12s;
}
.file-drop:hover, .file-drop.over { border-color: var(--brand); background: var(--brand-light); color: var(--brand); }

.ad-thumb { border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; background: var(--surface-2); }
.ad-thumb img { width: 100%; display: block; max-height: 260px; object-fit: contain; }
.ad-thumb .meta { padding: 8px 10px; font-size: 12.5px; display: flex; gap: 6px; align-items: center; }

.mini-list { list-style: none; margin: 0; padding: 0; }
.mini-list li { padding: 8px 10px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: center; font-size: 13.5px; }
.mini-list li:last-child { border-bottom: none; }
.mini-list li.done { opacity: .55; }
.mini-list li.done .txt { text-decoration: line-through; }

.print-only { display: none; }
@media print {
  .sidebar, .topbar, .btn, .no-print { display: none !important; }
  .content { padding: 0; }
  .card { box-shadow: none; page-break-inside: avoid; }
  .print-only { display: block; }
  body { background: #fff; }
}

</style>
</head>

 */

/* ============================ לועזי <-> absolute ============================ */

const GREG_MONTH_DAYS = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];

function isGregLeap(y) {
  return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
}

function daysInGregMonth(y, m) {
  if (m === 2 && isGregLeap(y)) return 29;

/** תאריך לועזי (y,m,d) -> מספר יום אבסולוטי */
function gregToAbs(y, m, d) {
  let days = d;
  for (let i = 1; i < m; i++) days += daysInGregMonth(y, i);
  const py = y - 1;
  days += 365 * py + Math.floor(py / 4) - Math.floor(py / 100) + Math.floor(py / 400);

}

function isHebLeapYear(year) {

function hebElapsedDays(year) {

    5 + 12 * monthsElapsed + 793 * Math.floor(monthsElapsed / 1080) + Math.floor(partsElapsed / 1080);

async function inflateRaw(bytes) {
  if (typeof DecompressionStream === 'undefined') {
    throw new Error('הדפדפן אינו תומך בפריסת קבצי xlsx — יש לייבא כקובץ CSV');
  }

  const stream = new Blob([bytes]).stream().pipeThrough(ds);

}

async function unzip(buffer) {
  const bytes = new Uint8Array(buffer);
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  let eocd = -1;
  for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 66000); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('הקובץ אינו ZIP/XLSX תקין');
  const count = dv.getUint16(eocd + 10, true);
  let ptr = dv.getUint32(eocd + 16, true);
  const out = {};
  const dec = new TextDecoder('utf-8');

  for (let i = 0; i < count; i++) {
    if (dv.getUint32(ptr, true) !== 0x02014b50) break;
    const method = dv.getUint16(ptr + 10, true);
    const compSize = dv.getUint32(ptr + 20, true);
    const nameLen = dv.getUint16(ptr + 28, true);
    const extraLen = dv.getUint16(ptr + 30, true);
    const commentLen = dv.getUint16(ptr + 32, true);
    const localOff = dv.getUint32(ptr + 42, true);
    const name = dec.decode(bytes.subarray(ptr + 46, ptr + 46 + nameLen));

    const lNameLen = dv.getUint16(localOff + 26, true);
    const lExtraLen = dv.getUint16(localOff + 28, true);
    const dataStart = localOff + 30 + lNameLen + lExtraLen;
    const raw = bytes.subarray(dataStart, dataStart + compSize);
    out[name] = method === 0 ? raw : await inflateRaw(raw);
    ptr += 46 + nameLen + extraLen + commentLen;
  }
  return out;
}

function refToCol(ref) {
  const m = /^([A-Z]+)/.exec(ref);
  if (!m) return 0;
  let n = 0;
  for (const ch of m[1]) n = n * 26 + (ch.charCodeAt(0) - 64);
  return n - 1;
}

    .filter((k) => /^xl\/worksheets\/sheet\d+\.xml$/.test(k))
    .sort((a, b) => (+a.match(/\d+/)[0]) - (+b.match(/\d+/)[0]));

      rows[rIdx] = arr;
    }
    for (let k = 0; k < rows.length; k++) if (!rows[k]) rows[k] = [];
    sheets.push({ name: names[i] || ('גיליון ' + (i + 1)), rows });

/* ================================ CSV ================================ */

function toCsv(rows, delimiter = ',') {
  return rows.map((r) => r.map((v) => {
    const s = String(v == null ? '' : v);
    return /[",\n\r\t;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(delimiter)).join('\r\n');
}

function parseCsv(text) {
  const s = text.replace(/^﻿/, '');
  const firstLine = s.split(/\r?\n/)[0] || '';
  const counts = { ',': 0, ';': 0, '\t': 0 };
  let inQ = false;
  for (const ch of firstLine) {
    if (ch === '"') inQ = !inQ;
    else if (!inQ && ch in counts) counts[ch]++;
  }
  const best = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
  const delim = best[1] > 0 ? best[0] : ',';

  const rows = [];
  let row = [], cell = '', q = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (q) {
      if (ch === '"') { if (s[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += ch;
    } else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cell); cell = ''; }
    else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (ch === '\r') { /* ignore */ }
    else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

  downloadBlob(buildXlsx(sheets), filename.endsWith('.xlsx') ? filename : filename + '.xlsx');
}

function downloadCsv(rows, filename) {
  const blob = new Blob(['﻿' + toCsv(rows)], { type: 'text/csv;charset=utf-8;' });
  downloadBlob(blob, filename.endsWith('.csv') ? filename : filename + '.csv');
}

/** קורא קובץ נתונים (xlsx/csv) ומחזיר גיליונות אחידים */
async function readTableFile(file) {
  const name = (file.name || '').toLowerCase();
  if (name.endsWith('.xlsx') || name.endsWith('.xlsm')) return await readXlsx(file);
  const text = await file.text();
  return [{ name: file.name, rows: parseCsv(text) }];

      tbody.appendChild(tr);
    });

    /* ------- שורת סיכום ------- */
    if (cfg.showTotals !== false && sale.customers.length) {
      const t = saleTotals(sale);
      const ftr = el('tr');
      if (opts.selectable) ftr.appendChild(el('td'));
      ftr.appendChild(el('td.center', { text: 'סה״כ' }));
      for (const col of cols) {
        let txt = '';
        if (col.key === 'price') txt = money(t.revenue);
        else if (col.key === 'paidAmount') txt = money(t.collected);
        else if (col.key === 'paid') txt = `${t.paidCount}/${t.count}`;
        else if (col.key === 'delivered') txt = `${t.delivered}/${t.count}`;
        ftr.appendChild(el('td', { text: txt, class: col.type === 'check' ? 'center' : '' }));
      }
      ftr.appendChild(el('td'));
      tfoot.appendChild(ftr);
    }
  }

  function commit() {
    store.save();
    onChange && onChange();
    draw();
  }

  draw();
  wrap.appendChild(el('div.table-wrap', {}, [table]));
  wrap._redraw = draw;
  wrap._selected = selected;
  return wrap;
}

        if (col.key === 'paid' && !v && num(cust.paidAmount) === num(cust.price)) cust.paidAmount = '';

  sale.customers.forEach((cust, i) => {
    rows.push([String(i + 1), ...cols.map((c) => {

  });

    rows.push(['שולם', t.collected]);
    rows.push(['יתרה לתשלום', t.outstanding]);

  for (const c of store.state.campaigns) {

    }
  }
  downloadXlsx([{ name: 'קמפיינים', rows }], 'דוח צינתוקים.xlsx');

}

      el('div', { style: { marginTop: '14px', fontSize: '13px', color: '#64748b' } }, [
        el('div', { text: `מכירות במערכת: ${store.state.sales.length}` }),
        el('div', { text: `לקוחות: ${store.state.sales.reduce((a, s) => a + (s.customers || []).length, 0)}` }),
        el('div', { text: `רשומות בארכיון: ${store.state.archive.length}` }),
        el('div', { text: `קמפיינים: ${store.state.campaigns.length}` }),
      ]),
    ]),
  ]));

  /* -------------------------- נתוני הדגמה -------------------------- */
  root.appendChild(el('div.card', {}, [
    el('h3', {}, ['נתוני הדגמה']),
    el('div.card-body', {}, [
      el('p', { style: { marginTop: 0, color: '#64748b' }, text: 'טעינת מכירות לדוגמה כדי להתנסות במערכת. לא ימחק נתונים קיימים.' }),
      el('button.btn', { text: 'טעינת נתוני הדגמה', onclick: () => { loadDemo(); toastOk('נתוני ההדגמה נטענו'); nav('calendar'); } }),
    ]),
  ]));

  function refreshBrand() {
    const b = document.querySelector('.sidebar .brand h1');
    const p = document.querySelector('.sidebar .brand p');
    if (b) b.textContent = S.orgName;
    if (p) p.textContent = S.subtitle;
  }
}

/* ------------------------------ הדגמה ------------------------------ */

function loadDemo() {
  const today = new Date();
  // מדלג על שישי/שבת כדי שנתוני ההדגמה ייפלו על ימים פעילים
  const iso = (offset) => {
    const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() + offset);
    while (d.getDay() === 5 || d.getDay() === 6) d.setDate(d.getDate() + (offset >= 0 ? 1 : -1));
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  };
  const demos = [
    { date: iso(2), city: 'ירושלים', neighborhood: 'רמות', hallName: 'אולמי הדר', street: 'הרב פרנק', houseNumber: '12',
      customers: [
        ['ישראל', 'כהן', '0501234567', 'ראייה', '-1.25', '-1.50', 450, true, true],
        ['שרה', 'לוי', '0527654321', 'מולטיפוקל', '+2.00', '+2.25', 1250, false, false],
        ['משה', 'פרידמן', '0533456789', 'קריאה', '+1.50', '+1.50', 320, true, false],
      ] },
    { date: iso(-12), city: 'בני ברק', neighborhood: 'פרדס כץ', hallName: 'היכל שמחה', street: 'רבי עקיבא', houseNumber: '88',
      customers: [
        ['חיים', 'רוזנברג', '0544567890', 'ראייה', '-3.00', '-2.75', 690, true, true],
        ['רבקה', 'ויס', '0556789012', 'שמש', '0', '0', 240, true, true],
        ['יעקב', 'שטרן', '0587654321', 'מולטיפוקל', '+1.75', '+2.00', 1450, false, false],
        ['מרים', 'גולד', '0523344556', 'קריאה', '+2.50', '+2.50', 280, true, true],
      ] },
    { date: iso(-40), city: 'אשדוד', neighborhood: 'רובע ז׳', hallName: 'אולם הרובע', street: 'הרצל', houseNumber: '5',
      customers: [
        ['דוד', 'ביטון', '0501112223', 'ראייה', '-0.75', '-1.00', 380, true, true],
        ['אסתר', 'מזרחי', '0509998887', 'מחשב', '-1.00', '-1.00', 520, true, true],
      ] },
  ];

  store.update((s) => {
    for (const d of demos) {
      const sale = {
        id: uid(), date: d.date, slot: 1, city: d.city, neighborhood: d.neighborhood,
        hallName: d.hallName, street: d.street, houseNumber: d.houseNumber,
        startTime: '17:00', endTime: '22:00', status: 'confirmed', separation: 'הפרדה מלאה',
        contactName: '', contactPhone: '',
        costs: [
          { id: uid(), label: 'מחיר האולם', amount: 800, paymentMethod: 'העברה בנקאית', paidTo: 'ועד השכונה', status: 'שולם', dueDate: '', note: '' },
          { id: uid(), label: 'מודעה במקומון', amount: 350, paymentMethod: 'אשראי', paidTo: 'מקומון', status: 'שולם', dueDate: '', note: '' },
          { id: uid(), label: 'הדפסת והדבקת מודעות', amount: 220, paymentMethod: 'מזומן', paidTo: 'מדביק', status: 'טרם שולם', dueDate: '', note: '' },
        ],
        customers: d.customers.map(([fn, ln, ph, gt, re, le, price, paid, delivered]) => ({
          id: uid(), firstName: fn, lastName: ln, phone: ph, email: '',
          city: d.city, neighborhood: d.neighborhood, glassesType: gt,
          rightEye: re, leftEye: le, price, paid, paidAmount: paid ? price : '',
          paymentMethod: paid ? 'מזומן' : '', delivered, notes: '',
        })),
        tasks: [
          { id: uid(), title: 'אופטומטריסט', assignee: 'ר׳ יוסי', done: true, dueDate: '', note: '' },
          { id: uid(), title: 'להוסיף משקפי קריאה +3.00', assignee: '', done: false, dueDate: '', note: '' },
        ],
        notes: [{ id: uid(), text: 'מכירה בהפרדה מלאה — כניסה נפרדת מרחוב צדדי.', createdAt: new Date().toISOString() }],
        ads: [], campaigns: [], createdAt: new Date().toISOString(),
      };
      s.sales.push(sale);
    }
  });
}

return { render, loadDemo };
})();

__M["app"] = (function () {
/**
 * app.js — נקודת הכניסה: אתחול הנתונים, תפריט ניווט וניתוב בין המסכים.
 */
const { store } = __M["store"];
const { el, clear, toastErr } = __M["ui"];
const calendarView = __M["views/calendar"];
const saleView = __M["views/sale"];
const pastView = __M["views/past"];
const reportsView = __M["views/reports"];
const campaignsView = __M["views/campaigns"];
const settingsView = __M["views/settings"];
const ROUTES = {
  calendar:  { title: 'לוח שנה — דשבורד מרכזי', icon: '📅', label: 'לוח שנה', view: calendarView },
  sale:      { title: 'ניהול יום מכירה', icon: '🛒', label: 'יום מכירה', view: saleView, hidden: true },
  past:      { title: 'מכירות קודמות ומאגר לקוחות', icon: '📚', label: 'מכירות קודמות', view: pastView },
  reports:   { title: 'דוחות', icon: '📊', label: 'דוחות', view: reportsView },
  campaigns: { title: 'צינתוקים והודעות', icon: '📞', label: 'צינתוקים', view: campaignsView },
  settings:  { title: 'הגדרות', icon: '⚙️', label: 'הגדרות', view: settingsView },
};

let current = { route: 'calendar', params: {} };

function parseHash() {
  const h = (location.hash || '#/calendar').replace(/^#\/?/, '');
  const [route, query] = h.split('?');
  const params = {};
  if (query) for (const [k, v] of new URLSearchParams(query)) params[k] = v;
  return { route: ROUTES[route] ? route : 'calendar', params };
}

function navigate(route, params = {}) {
  const qs = new URLSearchParams(params).toString();
  location.hash = `#/${route}${qs ? '?' + qs : ''}`;
}

function renderNav() {
  const nav = el('nav.nav');
  for (const [key, r] of Object.entries(ROUTES)) {
    if (r.hidden) continue;
    nav.appendChild(el('a', {
      class: current.route === key ? 'active' : '',
      onclick: () => navigate(key),
    }, [el('span.ico', { text: r.icon }), r.label]));
  }
  return nav;
}

function renderShell() {
  const S = store.state.settings;
  document.body.innerHTML = '';
  const contentEl = el('div.content#content');
  const titleEl = el('h2', { text: ROUTES[current.route].title });

  const sidebar = el('aside.sidebar', {}, [
    el('div.brand', {}, [
      el('h1', { text: S.orgName || 'אופטיקה לכל כיס' }),
      el('p', { text: S.subtitle || '' }),
    ]),
    renderNav(),
    el('div.sidebar-foot', { text: 'מערכת ניהול מכירות משקפיים' }),
  ]);

  document.body.appendChild(el('div.app', {}, [
    sidebar,
    el('main.main', {}, [
      el('header.topbar', {}, [
        titleEl,
        el('div.spacer'),
        el('button.btn.sm', { text: '📅 לוח שנה', onclick: () => navigate('calendar') }),
        el('button.btn.sm', { text: '📊 דוחות', onclick: () => navigate('reports') }),
      ]),
      contentEl,
    ]),
  ]));
  return contentEl;
}

function renderRoute() {
  current = parseHash();
  const content = renderShell();
  try {
    ROUTES[current.route].view.render(content, navigate, current.params);
  } catch (e) {
    console.error(e);
    clear(content);
    content.appendChild(el('div.card', {}, [
      el('h3', {}, ['אירעה שגיאה']),
      el('div.card-body', {}, [
        el('p', { text: e.message }),
        el('pre', { text: e.stack || '', style: { fontSize: '11px', direction: 'ltr', overflow: 'auto' } }),
      ]),
    ]));
    toastErr('אירעה שגיאה: ' + e.message);
  }
  window.scrollTo(0, 0);
}

window.addEventListener('hashchange', renderRoute);

(async function boot() {
  await store.init();
  if (!location.hash) location.hash = '#/calendar';
  renderRoute();
  // חשיפה לצורכי איתור תקלות ובדיקות
  window.__app = { store, navigate, loadDemo: settingsView.loadDemo };
})();

return { navigate };
})();
})();
</script>
